<div style="max-width: 600px; margin: 2.5rem auto" class="card">
  <div
    class="brand-icon"
    style="
      margin: 0 auto 0.75rem auto;
      width: 48px;
      height: 48px;
      font-size: 1.4rem;
    "
  >
    AIAS
  </div>
  <div style="text-align: center; margin-bottom: 1.5rem">
    <h2 style="font-size: 1.5rem; font-weight: 800">Lecturer Registration</h2>
    <p style="color: var(--text-muted); font-size: 0.875rem">
      Create an account to conduct assessment item analysis
    </p>
  </div>

  <div *ngIf="errorMessage" class="alert alert-danger">
    {{ errorMessage }}
  </div>

  <form (ngSubmit)="onRegister()">
    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">First Name *</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="firstName"
          name="first_name"
          required
          placeholder="e.g. Jane"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Middle Name</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="middleName"
          name="middle_name"
          placeholder="e.g. Mary"
        />
      </div>

      <div class="form-group">
        <label class="form-label">Surname / Last Name *</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="surname"
          name="surname"
          required
          placeholder="e.g. Doe"
        />
      </div>
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">School / Institution *</label>
        <select
          class="form-control"
          [(ngModel)]="school"
          name="school"
          required
        >
          <option value="" disabled selected>Select School/Institution</option>
          <option *ngFor="let s of schoolOptions" [value]="s">
            {{ s }}
          </option>
        </select>
      </div>

      <div class="form-group">
        <label class="form-label">Profession / Title *</label>
        <input
          type="text"
          class="form-control"
          [(ngModel)]="profession"
          name="profession"
          required
          placeholder="e.g. Associate Professor"
        />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Specialization *</label>
      <input
        type="text"
        class="form-control"
        [(ngModel)]="specialization"
        name="specialization"
        required
        placeholder="e.g. Computer Science, Mathematics"
      />
    </div>

    <div class="form-grid">
      <div class="form-group">
        <label class="form-label">Email Address *</label>
        <input
          type="email"
          class="form-control"
          [(ngModel)]="email"
          (ngModelChange)="onEmailChange()"
          name="email"
          required
          placeholder="e.g. jdoe@university.edu"
        />
        <small *ngIf="duplicateEmail" style="color: var(--danger)">
          An account with this email already exists.
        </small>
      </div>

      <div class="form-group">
        <label class="form-label">Password *</label>
        <input
          type="password"
          class="form-control"
          [(ngModel)]="password"
          name="password"
          required
          placeholder="At least 6 characters"
        />
      </div>
    </div>

    <div class="form-group">
      <label class="form-label">Confirm Password *</label>
      <input
        type="password"
        class="form-control"
        [(ngModel)]="confirmPassword"
        name="confirm_password"
        required
        placeholder="Re-enter your password"
      />
      <small
        *ngIf="confirmPassword && password !== confirmPassword"
        style="color: var(--danger)"
      >
        Passwords do not match.
      </small>
    </div>

    <button
      type="submit"
      class="btn btn-primary"
      style="width: 100%; margin-top: 0.5rem"
      [disabled]="loading || duplicateEmail"
    >
      {{ loading ? "Creating Account..." : "Register Lecturer Account" }}
    </button>
  </form>

  <div style="text-align: center; margin-top: 1.25rem; font-size: 0.875rem">
    Already registered?
    <a routerLink="/login" style="color: var(--primary); font-weight: 600"
      >Sign In</a
    >
  </div>
</div>
